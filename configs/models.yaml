# Model Configuration
# Paths and settings for all AI models

stt:
  provider: "faster-whisper"
  model_size: "medium"  # small, medium, large-v2, large-v3
  device: "cuda"
  compute_type: "float16"  # float16 for RTX 4090
  beam_size: 5
  best_of: 5
  temperature: 0.0
  compression_ratio_threshold: 2.4
  logprob_threshold: -1.0
  no_speech_threshold: 0.6

vad:
  provider: "silero"
  model_path: null  # Auto-download if null
  threshold: 0.5
  min_speech_duration_ms: 250
  max_speech_duration_s: float('inf')
  min_silence_duration_ms: 100
  speech_pad_ms: 30

llm:
  provider: "llama.cpp"
  model_path: "./models/llama-3.1-8b-instruct-q4_k_m.gguf"
  n_ctx: 4096
  n_batch: 512
  n_threads: 8
  n_gpu_layers: 35  # Use GPU for most layers on RTX 4090
  use_mmap: true
  use_mlock: false
  temperature: 0.7
  top_p: 0.9
  top_k: 40
  repeat_penalty: 1.1
  streaming: true

tts:
  provider: "xtts"
  model_name: "tts_models/multilingual/multi-dataset/xtts_v2"
  device: "cuda"
  voice_clone_reference: "./data/audio/clean/reference.wav"
  language: "en"
  speed: 1.0
  stream_chunk_size: 512
  sample_rate: 24000

avatar:
  lip_sync:
    provider: "wav2lip"
    model_path: "./models/wav2lip_gan.pth"
    face_detection_model: "./models/mobilenet.pth"
    device: "cuda"
    resize_factor: 1
    face_det_batch_size: 1
    wav2lip_batch_size: 1
  
  face_source:
    type: "video"  # video or image
    path: "./data/video/face_source.mp4"
    fps: 25
  
  render:
    output_width: 512
    output_height: 512
    fps: 25
    codec: "libx264"

intent_emotion:
  provider: "distilbert"
  model_name: "distilbert-base-uncased-finetuned-sst-2-english"
  device: "cuda"
  batch_size: 8
  max_length: 128

